# Mission 033 : publie le zip de démonstration essai-manuel.zip (données FICTIVES aux noms du manuel,
# spec § 5) et son flashcode, pour que Pascal voie sur le Samsung les couleurs du plugin 0.3.0 sans
# attendre le zip réel Serre_EA2026 de JFC.
#  - push sur la branche mission/033-essai-manuel ou sur main, ou lancement manuel : préversion à
#    étiquette FIXE « essai-manuel », supprimée puis recréée à chaque fois (comme « projet-modele ») ;
#  - jamais « latest » (--latest=false) : « releases/latest/download/plugin-vision.zip » doit continuer
#    à désigner la release du plugin ;
#  - adresse stable :
#      https://github.com/pobsteta/vision/releases/download/essai-manuel/essai-manuel.zip
#  - le zip est fabriqué ici par outils/zip-essai-manuel.mjs (testé, identique à l'octet à chaque fois),
#    il n'est pas versé au dépôt ; son sha256 est écrit dans les notes ; le flashcode (PNG et SVG) est
#    généré puis contrôlé par décodage (outils/flashcodes.mjs, type « manuel »).
# Mission 035 : la même préversion contient aussi essai-manuel-geojson.zip (mêmes quatre couches, tout en
# GeoJSON) et son flashcode, contrôlé par décodage ; à prendre tant que le plugin ne lit pas les Shapefile
# (mission 024).
# Mission 040 : la même préversion contient aussi piege.zip (zip de recette de la mission 016, données
# fictives, cinq pièges, fabriqué par outils/zips-recette.mjs <dossier> piege) et son flashcode, contrôlé par
# décodage ; les notes disent les lignes attendues avec le plugin 0.4.0.
# Mission 047 : la même préversion contient aussi essai-gpkg-style.zip (données fictives : un GeoPackage de deux
# tables, Parcelles avec un style enregistré dans layer_styles, UG sans ; fabriqué par outils/zip-essai-gpkg-style.mjs)
# et son flashcode, contrôlé par décodage ; les notes disent ce que Pascal doit voir avec le plugin 0.4.2.
# Ce workflow ne touche ni au plugin (release-plugin.yml, « plugin-essai ») ni au projet modèle.
# Aucune clé, aucun secret : le jeton du dépôt suffit.
name: Release de l'essai du manuel
on:
  push:
    branches: ['main', 'mission/050-vision']
    paths: ['outils/zip-essai-manuel.mjs', 'outils/zips-recette.mjs', 'outils/zip-essai-gpkg-style.mjs', 'outils/flashcodes.mjs', 'tests/recette/essai/zip-ecrire.mjs', '.github/workflows/release-essai-manuel.yml']
  workflow_dispatch:
permissions:
  contents: write
# Une publication à la fois, sans jamais en annuler une en cours : la suppression puis la recréation
# de l'étiquette fixe ne doit pas être interrompue ni se chevaucher.
concurrency:
  group: release-essai-manuel
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances Python des outils (pyproj, mission 002)
        run: pip install -r outils/requirements.txt
      - name: Outils des flashcodes (qrencode, zbar-tools ; mission 025)
        run: sudo apt-get update && sudo apt-get install -y qrencode zbar-tools
      - name: Tests
        env:
          VISION_FLASHCODES_EXIGER: '1'
        run: node --test
      - name: Zip
        run: |
          node outils/zip-essai-manuel.mjs dist
          node --no-warnings outils/zips-recette.mjs dist piege
          node --no-warnings outils/zip-essai-gpkg-style.mjs dist
      - name: Flashcode (génération et contrôle par décodage)
        run: |
          node outils/flashcodes.mjs generer dist/flashcodes manuel essai
          node outils/flashcodes.mjs verifier dist/flashcodes manuel essai
          node outils/flashcodes.mjs generer dist/flashcodes-geojson manuel-geojson essai
          node outils/flashcodes.mjs verifier dist/flashcodes-geojson manuel-geojson essai
          node outils/flashcodes.mjs generer dist/flashcodes-piege piege essai
          node outils/flashcodes.mjs verifier dist/flashcodes-piege piege essai
          node outils/flashcodes.mjs generer dist/flashcodes-gpkg-style gpkg-style essai
          node outils/flashcodes.mjs verifier dist/flashcodes-gpkg-style gpkg-style essai
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Quatre zips : deux zips de démonstration aux noms du manuel (mêmes quatre couches, mêmes données), le zip piégé de la recette et le zip d'essai du style d'un GeoPackage :"
            echo
            echo "- **essai-manuel-geojson.zip** : UG, Parcelles, FRT et l'export ProdBois, tout en **GeoJSON**. **À prendre tant que le plugin ne lit pas les Shapefile (mission 024)** : le plugin actuel ne lit que le GeoJSON."
            echo "- **essai-manuel.zip** : UG, Parcelles, FRT en Shapefile et l'export ProdBois en GeoJSON. À prendre quand le plugin lira les Shapefile (mission 024)."
            echo "- **essai-gpkg-style.zip** : zip d'**essai** (mission 047), un GeoPackage de deux tables dont l'une garde son style enregistré (voir plus bas)."
            echo "- **piege.zip** : zip de **recette**, données **fictives**, huit fichiers, cinq pièges (mission 016). Il doit donner **un message clair par piège** ; ce n'est pas un zip à utiliser sur le terrain."
            echo
            echo "**Données fictives**, en Lambert 93 (EPSG:2154), près de Fontainebleau : aucune donnée de l'ONF. À importer dans vision.qgz avec le plugin Vision 0.5.0 ou plus (bouton d'import du plugin, sans réseau). Avant la 0.3.2, toute couche était refusée (« système de coordonnées inconnu »)."
            echo
            echo "Version du $(date -u +%Y-%m-%d), commit ${GITHUB_SHA}."
            echo
            echo "### Ce que Pascal doit voir (couleurs du mail de JFC, spec § 5)"
            echo
            echo "- **UG** (2 polygones, codes UG01 et UG02) : contour bleu #0000FF, 0,6 mm, sans remplissage ; étiquette du code, 10 pt, bleue."
            echo "- **Parcelles** (4 polygones, codes 12 à 15) : contour orange #FF8C00, 1 mm, sans remplissage ; étiquette du code, 15 pt, orange."
            echo "- **FRT** (3 polygones, codes FRT01 à FRT03) : contour vert-bleu #008B8B, 0,6 mm, sans remplissage ; étiquette du code, 10 pt, #008B8B."
            echo "- **Essai_p5_13_30_Res** (10 points ProdBois) : cercle noir plein de 2 mm ; étiquette sur deux lignes, essence puis diamètre (8 pt, noire, liseré blanc)."
            echo "- Les accents (Chêne, Réservée) s'affichent sans caractères abîmés ; aucun message de refus ; les 4 couches sont en lecture seule et reviennent à la réouverture du projet."
            echo
            echo
            echo "### Ce que Pascal doit voir avec piege.zip (plugin 0.4.0, préversion « plugin-essai », PR #38)"
            echo
            echo "Importer piege.zip dans vision.qgz : le panneau doit afficher ces lignes, et seulement elles."
            echo
            echo "- « 2 couches chargées : UG_vide, Zone_inconnue » (Zone_inconnue : style QGIS par défaut, nom non reconnu) ;"
            echo "- « UG_vide.geojson : couche vide » (avertissement, la couche est chargée) ;"
            echo "- « Parcelles_sans_prj.shp : fichier .prj manquant, système de coordonnées inconnu » (refus) ;"
            echo "- « UG_sans_crs.geojson : Coordonnées incohérentes : système mal déclaré ? » (refus) ;"
            echo "- « FRT_sans_georef.tif : système de coordonnées inconnu » (refus)."
            echo
            echo "Le plugin stable 0.3.4 ne lit que le GeoJSON : avec lui, les pièges Shapefile et GeoTIFF sont ignorés sans message. Les lignes ci-dessus ne valent que pour le plugin 0.4.0 ou plus."
            echo
            echo "### Ce que Pascal doit voir avec essai-gpkg-style.zip (plugin 0.4.2, préversion « plugin-essai », mission 047)"
            echo
            echo "- **essai-gpkg-style.zip** : zip d'**essai**, données **fictives**, un seul GeoPackage (Essai_style.gpkg) de deux tables de polygones. Importer dans vision.qgz : « 2 couches chargées : Parcelles, UG »."
            echo "- **Parcelles** (3 polygones) garde le style **enregistré dans le GeoPackage** : contour **vert** épais (2 mm), sans remplissage ; ni l'orange du manuel, ni le rouge (une ligne plus récente mais non par défaut ne doit pas s'afficher)."
            echo "- **UG** (2 polygones), sans style enregistré, prend la règle du manuel : contour **bleu** #0000FF, étiquette du code, 10 pt."
            echo "- Aucun avertissement. Fermer puis rouvrir le projet : les deux styles sont gardés. Si Parcelles est orange ou si le panneau dit « tables illisibles », la voie « SELECT » de lecture du GeoPackage ne passe pas sur l'appareil (non prouvée à ce jour)."
            echo
            echo '```'
            sha256sum dist/essai-manuel.zip dist/essai-manuel-geojson.zip dist/piege.zip dist/essai-gpkg-style.zip
            echo '```'
          } > notes.md
          echo >> notes.md
          node outils/flashcodes.mjs notes manuel-geojson essai essai-manuel >> notes.md
          echo >> notes.md
          # Le titre « Flashcodes de l'essai (préversion) » n'est écrit qu'une fois (mission 036) : on retire celui du second bloc.
          node outils/flashcodes.mjs notes manuel essai essai-manuel | tail -n +3 >> notes.md
          echo >> notes.md
          node outils/flashcodes.mjs notes piege essai essai-manuel | tail -n +3 >> notes.md
          echo >> notes.md
          node outils/flashcodes.mjs notes gpkg-style essai essai-manuel | tail -n +3 >> notes.md
          # Étiquette fixe : on supprime la release et son étiquette, puis on recrée sur le commit courant.
          if gh release view essai-manuel >/dev/null 2>&1; then
            gh release delete essai-manuel --cleanup-tag --yes
          fi
          # Étiquette orpheline (sans release) : à fermer avant de recréer.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/essai-manuel" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/essai-manuel"
          fi
          gh release create essai-manuel dist/essai-manuel.zip dist/flashcodes/* dist/essai-manuel-geojson.zip dist/flashcodes-geojson/* dist/piege.zip dist/flashcodes-piege/* dist/essai-gpkg-style.zip dist/flashcodes-gpkg-style/* \
            --target "$GITHUB_SHA" --title "Essai du manuel (données fictives)" --notes-file notes.md --prerelease --latest=false
