# Publie le plugin QField Cerf (mission 008 et suivantes) en release GitHub
# (décision de Pascal n° 2, 3 novembre 2026 ; plugin/PLAN.md § 6) :
#  - push sur la branche d'une mission du plugin : préversion « plugin-essai », écrasée à
#    chaque push, pour l'essai de Pascal sur le Samsung avant fusion ;
#  - push sur main : release « plugin-v<version> » (version lue dans plugin/metadata.txt),
#    publiée seulement si plugin/ a changé dans le push (décision de Pascal, 3 novembre 2026 ;
#    outils/decider-release.mjs), sinon sortie verte ; refusée si l'étiquette existe déjà
#    (oblige à monter la version). Lancement manuel sur main : publiée. URL stable :
#    https://github.com/pobsteta/cerf/releases/latest/download/plugin-cerf.zip
#  - Mission 022 : cette release ne porte QUE le plugin (plugin-cerf.zip) et l'essai de recette (essai.zip) ;
#    le projet modèle (projet-cerf.zip) n'a qu'une adresse, celle de release-projet-modele.yml
#    (.../releases/download/projet-modele/...). Seule « plugin-v<version> » devient « latest ».
#  - Mission 025 : le flashcode (PNG et SVG) de l'adresse du plugin est joint à la release et affiché dans
#    ses notes (outils/flashcodes.mjs ; qrencode pour générer, zbarimg pour décoder et contrôler l'URL).
#    Sur main : adresse stable (latest/download/plugin-cerf.zip) ; préversion d'essai : adresse de « plugin-essai ».
# Les zips sont fabriqués ici (ils ne sont pas versés au dépôt) ; leur sha256 est écrit dans
# les notes de la release. L'étiquette est créée par la release elle-même.
name: Release du plugin
on:
  push:
    branches: ['main', 'mission/008-squelette-plugin', 'mission/010-styles']
    paths: ['plugin/**', 'tests/**', '.github/workflows/release-plugin.yml']
  workflow_dispatch:
permissions:
  contents: write
# Une publication à la fois, sans jamais en annuler une en cours (deux pushes rapprochés se suivent).
concurrency:
  group: release-plugin
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Décision (publier ou non)
        id: decision
        env:
          EVENEMENT: ${{ github.event_name }}
          AVANT: ${{ github.event.before }}
        run: |
          action=$(node outils/decider-release.mjs "$EVENEMENT" "$GITHUB_REF_NAME" "$AVANT" "$GITHUB_SHA" 2>raison.txt)
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "Décision : $action. $(cat raison.txt)" >> "$GITHUB_STEP_SUMMARY"
          cat raison.txt
      - uses: actions/setup-python@v5
        if: steps.decision.outputs.action == 'publier'
        with:
          python-version: '3.12'
      - name: Dépendances Python des outils (pyproj, mission 002)
        if: steps.decision.outputs.action == 'publier'
        run: pip install -r outils/requirements.txt
      - name: Outils des flashcodes (qrencode, zbar-tools ; mission 025)
        if: steps.decision.outputs.action == 'publier'
        run: sudo apt-get update && sudo apt-get install -y qrencode zbar-tools
      - name: Tests
        if: steps.decision.outputs.action == 'publier'
        env:
          CERF_FLASHCODES_EXIGER: '1'
        run: node --test
      - name: Zips
        if: steps.decision.outputs.action == 'publier'
        run: |
          node plugin/empaqueter.mjs dist
          cp tests/recette/essai/essai.zip dist/
      - name: Flashcodes (génération et contrôle par décodage)
        if: steps.decision.outputs.action == 'publier'
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then mode=stable; else mode=essai; fi
          node outils/flashcodes.mjs generer dist/flashcodes plugin "$mode"
          node outils/flashcodes.mjs verifier dist/flashcodes plugin "$mode"
      - name: Release
        if: steps.decision.outputs.action == 'publier'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' plugin/metadata.txt)
          {
            echo "Plugin QField Cerf $version, à installer par URL (Paramètres, Plugins, « Install plugin from URL »)."
            echo
            echo "Ne pas renommer plugin-cerf.zip : QField nomme le dossier du plugin d'après le nom du zip."
            echo "Si l'ancien plugin « Cerf » (dossier cerf) est installé, le désinstaller une fois : plugin-cerf.zip s'installe à côté."
            echo "Essai sur le Samsung : plugin/PLAN.md § 9."
            echo
            echo '```'
            sha256sum dist/*.zip
            echo '```'
          } > notes.md
          echo >> notes.md
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            node outils/flashcodes.mjs notes plugin stable "plugin-v$version" >> notes.md
          else
            node outils/flashcodes.mjs notes plugin essai plugin-essai >> notes.md
          fi
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            gh release create "plugin-v$version" dist/plugin-cerf.zip dist/flashcodes/* \
              --target "$GITHUB_SHA" --title "Cerf $version" --notes-file notes.md --latest
          elif gh release view plugin-essai >/dev/null 2>&1; then
            # `gh release edit --target` ne déplace pas une étiquette existante (l'API ignore target_commitish
            # quand l'étiquette existe) : on la déplace par l'API Git, sur ce commit. Jamais une étiquette plugin-v*.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/plugin-essai" -f sha="$GITHUB_SHA" -F force=true
            gh release upload plugin-essai dist/plugin-cerf.zip dist/essai.zip dist/flashcodes/* --clobber
            gh release edit plugin-essai --notes-file notes.md --latest=false
          else
            gh release create plugin-essai dist/plugin-cerf.zip dist/essai.zip dist/flashcodes/* \
              --target "$GITHUB_SHA" --title "Cerf, essai avant fusion" --notes-file notes.md --prerelease --latest=false
          fi
