# Publie le prototype n° 1 (mission 004) en release GitHub « prototype-1 » à chaque push
# sur la branche du prototype (l'étiquette est créée par la release). Les zips sont fabriqués ici par prototype/empaqueter.mjs (ils ne sont pas
# versés au dépôt) ; leur sha256 est écrit dans les notes de la release.
name: Release du prototype
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances Python des outils (pyproj, mission 002)
        run: pip install -r outils/requirements.txt
      - name: Tests
        run: node --test
      - name: Zips
        run: |
          node prototype/empaqueter.mjs dist
          cp tests/recette/essai/essai.zip tests/recette/essai/essai-cp437.zip dist/
          # Projet modèle de la mission 006 (branche mission/006-projet-modele), zippé pour
          # l'import par URL de QField.
          git fetch --depth=1 origin mission/006-projet-modele
          git show FETCH_HEAD:vision.qgz > dist/vision.qgz
          (cd dist && zip -X vision-projet-modele.zip vision.qgz && rm vision.qgz)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Prototype n° 1 de Vision (mission 004), plugin QField jetable, à installer par URL."
            echo
            echo "Ne pas renommer vision-prototype.zip : QField nomme le dossier du plugin d'après le nom du zip."
            echo "Protocole d'essai : tests/recette/prototype-1.md."
            echo
            echo '```'
            sha256sum dist/*.zip
            echo
            echo "vision.qgz contenu dans vision-projet-modele.zip, pris sur mission/006-projet-modele :"
            (cd dist && unzip -p vision-projet-modele.zip vision.qgz | sha256sum | sed 's/-$/vision.qgz/')
            echo '```'
          } > notes.md
          if gh release view prototype-1 >/dev/null 2>&1; then
            gh release upload prototype-1 dist/vision-prototype.zip dist/vision-essai.zip dist/essai.zip dist/essai-cp437.zip dist/vision-projet-modele.zip --clobber
            gh release edit prototype-1 --notes-file notes.md
          else
            gh release create prototype-1 dist/vision-prototype.zip dist/vision-essai.zip dist/essai.zip dist/essai-cp437.zip dist/vision-projet-modele.zip \
              --target "$GITHUB_SHA" --title "Prototype n° 1" --notes-file notes.md --prerelease
          fi
